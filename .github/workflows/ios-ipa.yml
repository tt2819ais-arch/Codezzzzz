name: Build IPA for eSign

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      P12_PATH: signing_cert.p12
      MOBILEPROVISION_PATH: signing_profile.mobileprovision
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      P12_BASE64: ${{ secrets.P12_BASE64 }}
      MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
      EXPORT_METHOD: development
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare signing files from secrets
        run: |
          set -eo pipefail
          if [ -z "$P12_BASE64" ] || [ -z "$MOBILEPROVISION_BASE64" ]; then
            echo "Missing signing secrets. Required: P12_BASE64, MOBILEPROVISION_BASE64"
            exit 1
          fi
          echo "$P12_BASE64" | base64 --decode > "$P12_PATH"
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > "$MOBILEPROVISION_PATH"
          test -s "$P12_PATH"
          test -s "$MOBILEPROVISION_PATH"

          if ! openssl pkcs12 -in "$P12_PATH" -noout -passin "pass:${P12_PASSWORD:-}" >/dev/null 2>&1; then
            echo "P12_PASSWORD does not match the .p12 certificate, or P12_BASE64 is not the expected certificate export."
            echo "Re-export the iOS signing certificate as .p12 and update P12_BASE64 plus the exact export password in P12_PASSWORD."
            exit 1
          fi

      - name: Read provisioning profile metadata
        run: |
          set -eo pipefail
          if ! security cms -D -i "$MOBILEPROVISION_PATH" > profile.plist; then
            echo "MOBILEPROVISION_BASE64 does not decode to a valid .mobileprovision provisioning profile."
            echo "Update MOBILEPROVISION_BASE64 with base64 of the downloaded Apple provisioning profile file, not the profile UUID/name or an already-edited plist."
            exit 1
          fi

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist)
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' profile.plist)
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' profile.plist)
          PROFILE_BUNDLE_ID=${PROFILE_APP_ID#"$PROFILE_TEAM_ID".}

          if [ "$PROFILE_BUNDLE_ID" != "com.FPR.de65dbe" ] && [ "$PROFILE_BUNDLE_ID" != "*" ]; then
            echo "Provisioning profile bundle id '$PROFILE_BUNDLE_ID' does not match app bundle id 'com.FPR.de65dbe'."
            exit 1
          fi

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$PROFILE_TEAM_ID" >> "$GITHUB_ENV"

      - name: Install signing assets to keychain
        run: |
          set -eo pipefail
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          security import "$P12_PATH" \
            -k build.keychain \
            -P "${P12_PASSWORD:-}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$MOBILEPROVISION_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Build archive (signed)
        run: |
          set -eo pipefail
          xcodebuild \
            -project NetPulse.xcodeproj \
            -scheme NetPulse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/NetPulse.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER=com.FPR.de65dbe \
            archive

      - name: Export IPA (standard exportArchive)
        run: |
          set -eo pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$EXPORT_METHOD</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.FPR.de65dbe</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$TEAM_ID</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/NetPulse.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Validate IPA structure
        run: |
          set -eo pipefail
          test -f build/export/NetPulse.ipa
          unzip -l build/export/NetPulse.ipa | rg "Payload/.+\.app/Info.plist"
          unzip -l build/export/NetPulse.ipa | rg "Payload/.+\.app/NetPulse"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-ipa-esign-ready
          path: build/export/NetPulse.ipa

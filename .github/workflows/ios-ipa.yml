name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app bundle (unsigned)
        run: |
          set -eo pipefail
          xcodebuild \
            -project NetPulse.xcodeproj \
            -scheme NetPulse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Try archive (non-blocking)
        run: |
          set +e
          xcodebuild \
            -project NetPulse.xcodeproj \
            -scheme NetPulse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/NetPulse.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            archive
          echo "archive exit code: $?"

      - name: Export unsigned IPA
        run: |
          set -eo pipefail

          if [ -d build/NetPulse.xcarchive ]; then
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              echo '<plist version="1.0"><dict>'
              echo '  <key>method</key><string>development</string>'
              echo '  <key>signingStyle</key><string>manual</string>'
              echo '  <key>stripSwiftSymbols</key><true/>'
              echo '  <key>compileBitcode</key><false/>'
              echo '  <key>signingCertificate</key><string></string>'
              echo '</dict></plist>'
            } > ExportOptions.plist

            xcodebuild -exportArchive \
              -archivePath build/NetPulse.xcarchive \
              -exportPath build/export \
              -exportOptionsPlist ExportOptions.plist || true
          fi

          if [ ! -f build/export/NetPulse.ipa ]; then
            APP_PATH=""
            if [ -d build/NetPulse.xcarchive ]; then
              APP_PATH=$(find build/NetPulse.xcarchive -name "*.app" | head -n 1)
            fi
            if [ -z "$APP_PATH" ]; then
              APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Release-iphoneos/*.app" | head -n 1)
            fi
            if [ -z "$APP_PATH" ]; then
              echo "No .app found in archive or DerivedData"
              exit 1
            fi
            mkdir -p build/export/Payload
            cp -R "$APP_PATH" build/export/Payload/
            (cd build/export && /usr/bin/zip -qry NetPulse.ipa Payload)
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-unsigned-ipa
          path: build/export/NetPulse.ipa
